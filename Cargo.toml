[package]
name = "assistant_core"
version = "0.1.0"
edition = "2024"
description = "Markdown, math and diagrams for the Assistant apps, drawn the same on every platform"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
thiserror = "2"
usvg = "0.45"
ttf-parser = "0.25"
ratex-parser = "0.1.15"
ratex-layout = "0.1.15"
ratex-types = "0.1.15"
ratex-katex-fonts = "0.1.15"
# Vendored (MIT) with one change: fonts supplied by the app instead of the system's (see vendor/README.md).
mermaid-rs-renderer = { path = "vendor/mermaid-rs-renderer", default-features = false }
comrak = { version = "0.56", default-features = false }
url = "2"
percent-encoding = "2"
# The web's build (wasm32, with --features web): the same functions for JavaScript.
wasm-bindgen = { version = "0.2.129", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
yrs = { version = "0.28", features = ["sync"] }
# The server's build (--features print): notes typeset into PDF pages, by Typst as a library.
typst = { version = "0.15.1", optional = true }
typst-pdf = { version = "0.15.1", optional = true }
typst-layout = { version = "0.15.1", optional = true }

[features]
web = ["dep:wasm-bindgen", "dep:serde", "dep:serde-wasm-bindgen"]
print = ["dep:typst", "dep:typst-pdf", "dep:typst-layout"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

# Development builds (tests, and the one bindings are generated from) without debug info: it's most of their size.
[profile.dev]
debug = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
